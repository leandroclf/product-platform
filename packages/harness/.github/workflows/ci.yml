name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run validate
      - name: Build immutable package artifact
        run: |
          npm pack
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: product-platform-harness-${{ github.sha }}
          path: |
            *.tgz
            SHA256SUMS
          retention-days: 30

name: migrate-platform-history
on:
  push:
    paths: ['.github/workflows/migrate-platform.yml']
permissions:
  contents: write
jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror product-harness into product-platform-harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --mirror https://github.com/leandroclf/product-harness.git source.git
          cd source.git
          git push --mirror "https://x-access-token:${GH_TOKEN}@github.com/leandroclf/product-platform-harness.git"

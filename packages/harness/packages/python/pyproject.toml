[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-platform-harness"
version = "0.2.0"
description = "Provider-neutral ProductEvent runtime for the product-platform portfolio"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["product_platform_harness*"]

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build pip-audit
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: omnicli --help
      - name: Verify package and generate release evidence
        run: |
          python -m pip check
          python -m pip_audit --format cyclonedx-json --output dist/omnicli-${GITHUB_REF_NAME#v}.sbom.json
          sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - run: bash -n scripts/bootstrap.sh
      - run: bash scripts/bootstrap.sh
      - run: python -m omnicli lab verify --json
      - run: python -m omnicli conceive "offline CI validation" --dry-run --json
      - run: python -m omnicli doctor --offline --json
      - run: ruff check .
      - run: pytest --cov=omnicli --cov-report=term-missing
      - run: mypy
      - run: python -m pip check
      - run: pip-audit
      - run: omnicli --help
      - run: python -m build

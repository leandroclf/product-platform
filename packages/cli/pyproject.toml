[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omnicli"
version = "0.4.0"
description = "Local CLI orchestrator for AI-assisted engineering workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LF Soluções" }]
keywords = ["ai", "cli", "orchestration", "llm", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "setuptools>=83.0.0",
  "types-PyYAML>=6.0,<7",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<7",
  "pip-audit>=2.7,<3",
  "ruff>=0.6,<1",
]

[project.scripts]
omnicli = "omnicli.cli:app"

[project.urls]
Homepage = "https://github.com/leandroclf/OmniCLI"
Repository = "https://github.com/leandroclf/OmniCLI"
Documentation = "https://github.com/leandroclf/OmniCLI/tree/main/docs"
Issues = "https://github.com/leandroclf/OmniCLI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true

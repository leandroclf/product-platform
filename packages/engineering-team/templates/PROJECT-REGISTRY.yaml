schema_version: 1.0.0
governance_version: 1.0.0
projects:
  - id: ai-engineering-team
    repository: leandroclf/ai-engineering-team
    purpose: Portable engineering governance, local Linux workflow and native Dot bootstrap
    default_branch: main
    adapter: AGENTS.md
    openspec_root: openspec
    risk_profile: engineering-governance
    environments:
      repository:
        mutation_policy: branch-pr-preferred
      production:
        mutation_policy: explicit-approval
    access:
      read: true
      write: true
    validation:
      command: python scripts/validate.py
      notes: This is the structural entry check only. Run the complete current suite in docs/VALIDATION.md; CI includes hardening, contracts, unit/harness tests, documentation and Docker canaries.
    freshness:
      bind_base_sha: true
      revalidate_before_merge: true
    concurrency:
      lease_required_for_material_mutation: true
    compatible_governance: ">=1.0.0 <2.0.0"
    notes: First/self-hosting project. Re-read repository state before every consequential mutation.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kit-harness"
version = "1.0.0"
description = "Shared Product Harness contracts and Python runtime core"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_kit_harness*"]

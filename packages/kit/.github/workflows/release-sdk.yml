name: release-sdk-artifacts
on:
  push:
    tags: ['harness-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd packages/harness-ts && npm install && npm run build && npm pack
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build && python -m build packages/harness-python
      - uses: actions/upload-artifact@v4
        with:
          name: ai-kit-harness-sdk
          path: |
            packages/harness-ts/*.tgz
            packages/harness-python/dist/*

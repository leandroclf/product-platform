version: 2

tools:
  github:
    category: core
    default: true
    purpose: repository operations, PRs and collaboration

  context7:
    category: docs
    default: true
    purpose: current library/framework documentation
    setup: "npx ctx7 setup"
    source: "https://github.com/upstash/context7"

  playwright:
    category: browser
    default: false
    purpose: token-efficient browser automation and E2E verification
    install: "npm install -g @playwright/cli@latest"
    setup: "playwright-cli install --skills"
    source: "https://github.com/microsoft/playwright-cli"

  strix:
    category: security
    default: false
    purpose: authorized security assessment and remediation
    skills_install: "npx skills add usestrix/strix"
    cli_install: "pipx install strix-agent"
    source: "https://github.com/usestrix/strix"
    guardrail: "Run only against targets the operator owns or is explicitly authorized to test."

  ui_skill:
    category: ui
    default: false
    purpose: UI/UX implementation guidance
    status: exact-integration-required

  chrome_devtools:
    category: browser-debug
    default: false
    purpose: browser diagnostics and performance inspection

  database:
    category: data
    default: false
    purpose: project-specific PostgreSQL/Supabase/database access

  infrastructure:
    category: infra
    default: false
    purpose: Docker, Kubernetes and cloud operations

profiles:
  core: [github, context7]
  frontend: [github, context7, ui_skill, playwright, chrome_devtools]
  backend: [github, context7, database]
  devops: [github, context7, infrastructure]
  security: [github, context7, strix, playwright]
  fullstack: [github, context7, ui_skill, playwright, chrome_devtools, database]

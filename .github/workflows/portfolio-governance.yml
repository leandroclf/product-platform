name: Portfolio governance
on:
  schedule:
    - cron: '20 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: portfolio-governance
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate portfolio inventory
        env:
          GH_TOKEN: ${{ github.token }}
          PORTFOLIO_READ_TOKEN: ${{ secrets.PORTFOLIO_READ_TOKEN }}
          GH_OWNER: leandroclf
          GH_REPO: product-platform
        run: |
          python3 -m unittest discover -s tests -p test_portfolio_governance.py
          python3 scripts/portfolio_governance.py

name: kit
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/kit/**', 'platform-packages.json', 'requirements-validation.txt', '.github/workflows/kit.yml']
  push:
    branches: [main]
    paths: ['packages/kit/**', 'platform-packages.json', 'requirements-validation.txt', '.github/workflows/kit.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/kit
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        run: |
          bash -n scripts/ai-kit
          bash -n scripts/bootstrap.sh
      - name: Validate required structure
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f config/tools.yaml
          test -f skills/engineering/SKILL.md
          test -f skills/testing/SKILL.md
          test -f skills/ui/SKILL.md
          test -f skills/security/SKILL.md
      - name: Smoke-test profile detection
        run: bash scripts/ai-kit .
      - name: Smoke-test bootstrap without machine changes
        run: bash scripts/bootstrap.sh core
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - name: Validate architecture ownership and versioned contracts
        run: node scripts/validate-architecture.cjs
      - name: Validate LF brand provenance and G6 deployment mapping for all registered products
        run: |
          python3 scripts/validate-portfolio-brand-deploy.py
          python3 -m unittest discover -s scripts -p 'test_*brand*.py'
      - name: ProductEvent v1 conformance
        run: python3 scripts/conformance-product-event.py
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Install validation tooling (versions pinned at the repository root)
        run: python -m pip install -r ../../requirements-validation.txt
      - name: PlatformHandoff contract and registry validator
        run: python scripts/validate-platform-handoff.test.py

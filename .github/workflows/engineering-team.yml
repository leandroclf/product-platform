name: engineering-team
on:
  push:
    paths: ['packages/engineering-team/**', 'packages/kit/contracts/**', '.github/workflows/engineering-team.yml']
  pull_request:
    paths: ['packages/engineering-team/**', 'packages/kit/contracts/**', '.github/workflows/engineering-team.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: packages/engineering-team
concurrency:
  group: engineering-team-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-validation.txt
      - run: python scripts/validate.py
      - run: python scripts/validate_hardening.py
      - run: python scripts/validate_native_operations.py
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m unittest discover -s tests/unit -v
      - run: python docs/anexos/build/verificar_docs.py
      - run: python scripts/validate_documentation.py
      - run: python scripts/validate_skills.py
      - run: python scripts/validate_skill_evaluations.py
      - run: python scripts/validate_e2e_benchmarks.py
      - run: python scripts/validate_simulated_benchmarks.py
      - run: bash -n scripts/pr_chain.sh
      - run: bash -n scripts/install-local.sh bin/ai-team
      - run: bash scripts/install-local.sh --help
      - run: python scripts/local_team.py --help
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build pinned provider runtime without account credentials
        run: docker build -f runtimes/Dockerfile -t ai-eng-provider-cli:validation .
      - name: Verify CLI versions and capabilities offline without login
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp
          --tmpfs /home/agent:uid=1001,gid=1001
          --cap-drop ALL --security-opt no-new-privileges:true
          -v "$PWD:/work:ro" ai-eng-provider-cli:validation
          python3 scripts/runtime_smoke.py
      - name: Install local entry point in disposable runner
        run: |
          bash scripts/install-local.sh --check
          bash scripts/install-local.sh
      - name: Verify installed command
        run: "$HOME/.local/bin/ai-team --version"
      - name: Verify offline test isolation and immutable source
        run: .venv/bin/python scripts/local_isolation_smoke.py
      - name: Verify four stage mount boundaries without credentials or inference
        run: .venv/bin/python scripts/local_stage_isolation_smoke.py

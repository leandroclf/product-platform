name: Agent auto-merge (opt-in)
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  queue-merge:
    if: ${{ vars.AGENT_REVIEW_MODE == 'independent' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'agent-auto-merge') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This privileged workflow must only run trusted code from the default branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify independent approval and protected scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_REVIEWERS: ${{ vars.AGENT_TRUSTED_REVIEWERS }}
          AGENT_REVIEW_MODE: independent
        run: python3 scripts/agent_review_gate.py
      - name: Create repository-scoped integrator token
        id: integrator-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.INTEGRATOR_APP_ID }}
          private-key: ${{ secrets.INTEGRATOR_APP_PRIVATE_KEY }}
          repositories: product-platform
          permission-pull-requests: write
      - name: Queue GitHub native auto-merge
        env:
          GH_TOKEN: ${{ steps.integrator-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Integrator GitHub App token not available; fail closed"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash

name: Agent auto-merge (opt-in)
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Agent independent review gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR opt-in a revalidar e enfileirar
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  queue-merge:
    if: ${{ vars.AGENT_REVIEW_MODE == 'independent' && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'agent-auto-merge'))) }}
    environment: agent-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This privileged workflow must only run trusted code from the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve and revalidate live opt-in PR
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/agent_merge_candidate.py
      - name: Verify independent approval and protected scope
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head }}
          TRUSTED_REVIEWERS: ${{ vars.AGENT_TRUSTED_REVIEWERS }}
          AGENT_REVIEW_MODE: independent
        run: |
          python3 scripts/agent_review_gate.py
          python3 scripts/independent_pr_reviewer.py --check-ci "$PR_NUMBER" "$HEAD_SHA"
      - name: Create repository-scoped integrator token
        if: steps.candidate.outputs.eligible == 'true'
        id: integrator-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.INTEGRATOR_APP_ID }}
          private-key: ${{ secrets.INTEGRATOR_APP_PRIVATE_KEY }}
          repositories: product-platform
          permission-pull-requests: write
          permission-contents: write
      - name: Queue GitHub native auto-merge
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.integrator-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          HEAD_SHA: ${{ steps.candidate.outputs.head }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Integrator GitHub App token not available; fail closed"
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash --match-head-commit "$HEAD_SHA"

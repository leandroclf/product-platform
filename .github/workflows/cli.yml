name: cli

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/cli/**', 'packages/kit/contracts/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['packages/cli/**', 'packages/kit/contracts/**', '.github/workflows/cli.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/cli

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/cli/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e '.[dev]'
      - run: bash -n scripts/bootstrap.sh
      - run: bash scripts/bootstrap.sh
      - run: python -m omnicli lab verify --json
      - run: python -m omnicli conceive "offline CI validation" --dry-run --json
      - run: python -m omnicli doctor --offline --json
      - run: ruff check .
      - run: pytest --cov=omnicli --cov-report=term-missing
      - run: mypy
      - run: python -m pip check
      - run: omnicli --help
      - run: python -m build
      - name: Freeze installed-package location before selecting the audit interpreter
        run: |
          python - <<'PY'
          import os
          import sysconfig
          paths = sysconfig.get_paths()
          if paths['purelib'] != paths['platlib']:
              raise SystemExit('Audit requires explicit support for split site-packages')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CLI_AUDIT_SITE=' + paths['purelib'] + '\n')
          PY
      - name: Use supported audit tooling for the Python 3.10 package snapshot
        if: matrix.python-version == '3.10'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Audit toolchain and the original installed packages without suppressions
        run: |
          test -d "$CLI_AUDIT_SITE"
          python -m venv "$RUNNER_TEMP/cli-auditor"
          "$RUNNER_TEMP/cli-auditor/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cli-auditor/bin/python" -m pip install 'pip-audit==2.10.1' 'filelock==4.2.5'
          "$RUNNER_TEMP/cli-auditor/bin/python" -m pip_audit
          "$RUNNER_TEMP/cli-auditor/bin/python" -m pip_audit --path "$CLI_AUDIT_SITE"

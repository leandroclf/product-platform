name: Manual PR review packet
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create read-only review packet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR"
          else
            PR_NUMBER="$EVENT_PR"
          fi
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::Invalid PR number"; exit 1 ;;
          esac
          python3 scripts/manual_pr_review_packet.py --repo "$GH_REPO" --number "$PR_NUMBER"

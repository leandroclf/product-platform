name: harness-release
on:
  push:
    tags: ['harness-v*']
permissions:
  contents: write
defaults:
  run:
    working-directory: packages/harness
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PRODUCT_EVENT_CASES: ${{ github.workspace }}/packages/kit/contracts/product-event/fixtures/compatibility-cases.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Tag must match the TypeScript and Python package versions
        run: |
          version="${GITHUB_REF_NAME#harness-v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -qx "version = \"$version\"" packages/python/pyproject.toml
      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm install
      - run: npm run validate
      - run: npm pack
      - name: Build the Python wheel (pip only, no extra tooling)
        run: |
          python3 -m pip wheel --no-deps ./packages/python --wheel-dir wheel
          cp wheel/*.whl .
      - run: sha256sum *.tgz *.whl > SHA256SUMS
      - name: Record source commit and package hashes in release manifest
        run: |
          python3 ../../scripts/build_release_manifest.py \\
            --directory . --tag "$GITHUB_REF_NAME" \\
            --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \\
            --output RELEASE-PROVENANCE.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.tgz *.whl SHA256SUMS RELEASE-PROVENANCE.json --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag

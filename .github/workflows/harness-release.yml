name: harness-release
on:
  push:
    tags: ['harness-v*']
permissions:
  contents: write
defaults:
  run:
    working-directory: packages/harness
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PRODUCT_EVENT_CASES: ${{ github.workspace }}/packages/kit/contracts/product-event/fixtures/compatibility-cases.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Tag must match the TypeScript and Python package versions
        run: |
          version="${GITHUB_REF_NAME#harness-v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -qx "version = \"$version\"" packages/python/pyproject.toml
      - name: Tag commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm install
      - run: npm run validate
      - run: npm pack
      - run: sha256sum *.tgz > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.tgz SHA256SUMS --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag

name: cli-provider-compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "packages/cli/docs/provider-sources.txt"
      - "packages/cli/docs/provider-compatibility.md"
      - "packages/cli/scripts/check-official-docs.sh"
      - "packages/cli/src/omnicli/config.py"
      - "packages/cli/src/omnicli/models.py"
      - "packages/cli/tests/test_config.py"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/cli

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check official documentation URLs
        run: bash scripts/check-official-docs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/cli/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Check the provider registry
        run: pytest tests/test_config.py tests/test_subprocess_adapter.py

name: platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test_check_package_boundaries.py
      - run: python3 scripts/check-package-boundaries.py
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Contract between packages (cli envelope validated by the kit)
        run: |
          python -m pip install -r requirements-validation.txt
          python3 scripts/test_handoff_contract.py
